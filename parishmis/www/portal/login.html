{% extends "templates/web.html" %}

{% block head %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['"Space Grotesk"', 'sans-serif'],
                        body: ['"Work Sans"', 'sans-serif']
                    }
                }
            }
        };
    </script>
    <style>
        .navbar,
        .web-header,
        nav {
            display: none !important;
        }
        body,
        .web-page-wrapper,
        .page-wrapper,
        .page-content-wrapper,
        .page-content {
            background: #020617 !important;
            margin: 0 !important;
            padding-top: 0 !important;
        }
        .page-breadcrumb,
        .page-header,
        .page-head,
        .breadcrumb,
        .page-title,
        .page-title-row,
        footer,
        .web-footer,
        .page-footer {
            display: none !important;
        }
    </style>
{% endblock %}

{% block page_content %}
<div class="min-h-screen bg-slate-950 px-4 py-6 text-slate-50 font-body sm:py-8">
    <div class="mx-auto max-w-md">
        <div class="rounded-3xl border border-white/10 bg-slate-900/80 p-6 shadow-2xl">
            <p class="text-xs uppercase tracking-[0.35em] text-amber-300">ParishMIS</p>
            <h1 class="mt-3 font-display text-3xl">Portal Login</h1>
            <p class="mt-2 text-sm text-slate-300">Sign in to view your parish profile, giving history, and sacrament records.</p>

            <form id="portal-login-form" class="mt-6 space-y-4">
                <input type="hidden" name="redirect_to" value="{{ redirect_to }}">
                <label class="block text-sm font-semibold text-slate-200">
                    Email
                    <input name="usr" type="email" required class="mt-1 w-full rounded-2xl border border-white/10 bg-slate-950 px-4 py-3 text-base text-white" autocomplete="username" />
                </label>
                <label class="block text-sm font-semibold text-slate-200">
                    Password
                    <input name="pwd" type="password" required class="mt-1 w-full rounded-2xl border border-white/10 bg-slate-950 px-4 py-3 text-base text-white" autocomplete="current-password" />
                </label>
                <button type="submit" class="w-full rounded-2xl bg-amber-400 px-4 py-3 text-base font-semibold text-slate-950">Log In</button>
                <p id="portal-login-feedback" class="text-sm text-rose-200"></p>
            </form>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('portal-login-form');
        const feedback = document.getElementById('portal-login-feedback');
        if (!form) return;

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            feedback.textContent = 'Signing in…';

            const formData = new FormData(form);
            const redirectTo = formData.get('redirect_to') || '/portal';
            const body = new URLSearchParams();
            body.append('usr', formData.get('usr'));
            body.append('pwd', formData.get('pwd'));

            try {
                const response = await fetch('/api/method/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8',
                        'Accept': 'application/json'
                    },
                    body: body.toString(),
                    credentials: 'include'
                });

                const payload = await response.json().catch(() => ({}));
                if (!response.ok) {
                    throw new Error(payload.message || 'Login failed.');
                }

                window.location.href = redirectTo || payload.redirect_to || payload.home_page || '/portal';
            } catch (error) {
                feedback.textContent = error.message || 'Login failed. Please try again.';
            }
        });
    });
</script>
{% endblock %}
